{{- if .Values.agent.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orbit.agentServiceAccountName" . }}
  labels:
    app.kubernetes.io/name: orbit-agent
    app.kubernetes.io/part-of: orbit
    {{- include "orbit.commonLabels" . | nindent 4 }}
{{- end }}
