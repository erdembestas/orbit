{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-controller
  labels:
    app.kubernetes.io/name: orbit-controller
    app.kubernetes.io/part-of: orbit
    {{- include "orbit.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orbit-controller
      app.kubernetes.io/part-of: orbit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        checksum/db: {{ printf "%s:%s:%s:%s:%s:%s" .Values.db.host .Values.db.port .Values.db.name .Values.db.user .Values.db.password .Values.db.sslmode | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: orbit-controller
        app.kubernetes.io/part-of: orbit
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "orbit.controllerServiceAccountName" . }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
        - name: orbit-controller
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/orbit-controller
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
          {{- end }}
          volumeMounts:
            - name: orbit-config
              mountPath: {{ .Values.controller.configMountPath }}
              readOnly: true
            - name: orbit-db
              mountPath: {{ .Values.controller.dbMountPath }}
              readOnly: true
      volumes:
        - name: orbit-config
          configMap:
            name: orbit-config
        - name: orbit-db
          secret:
            secretName: orbit-db-secret
      nodeSelector:
        {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.controller.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.controller.affinity | nindent 8 }}
{{- end }}
