apiVersion: v1
kind: Secret
metadata:
  name: orbit-bootstrap-secret
  labels:
    app.kubernetes.io/name: orbit-api
    app.kubernetes.io/part-of: orbit
    {{- include "orbit.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  ORBIT_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.bootstrapAdmin.username | quote }}
  ORBIT_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.bootstrapAdmin.password | quote }}
  ORBIT_JWT_SECRET: {{ .Values.bootstrapAdmin.jwtSecret | quote }}
