{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: orbit-ui
  labels:
    app.kubernetes.io/name: orbit-ui
    app.kubernetes.io/part-of: orbit
    {{- include "orbit.commonLabels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app.kubernetes.io/name: orbit-ui
    app.kubernetes.io/part-of: orbit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: 8080
{{- end }}
