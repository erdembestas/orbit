apiVersion: v1
kind: Pod
metadata:
  name: orbit-test-healthz
  labels:
    app.kubernetes.io/name: orbit-api
    app.kubernetes.io/part-of: orbit
    {{- include "orbit.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.8.0
      command:
        - sh
        - -c
        - |
          curl -fsS http://orbit-ui:8080/ | grep -i "<!doctype html>"
          curl -fsS http://orbit-ui:8080/api/v1/info | grep app_name
