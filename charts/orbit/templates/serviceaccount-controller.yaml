{{- if .Values.controller.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orbit.controllerServiceAccountName" . }}
  labels:
    app.kubernetes.io/name: orbit-controller
    app.kubernetes.io/part-of: orbit
    {{- include "orbit.commonLabels" . | nindent 4 }}
{{- end }}
